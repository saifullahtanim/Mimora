<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Verifying Email — Mimora</title>
	
	<!-- INSTANT AUTO-VERIFICATION & ZERO-LATENCY REDIRECT TO LOGIN POPUP -->
	<script>
		(function () {
			try {
				var params = new URLSearchParams(window.location.search);
				var token = params.get('token');
				var email = params.get('email');

				if (!token && !email) {
					window.location.replace('/');
					return;
				}

				var apiUrl = '/api/verify-email?' + (token ? 'token=' + encodeURIComponent(token) : '') + (email ? '&email=' + encodeURIComponent(email) : '');
				
				fetch(apiUrl, {
					headers: { 'Accept': 'application/json' }
				})
				.then(function (res) { return res.json(); })
				.then(function (data) {
					var userEmail = data.email || (data.user && data.user.email) || email || '';
					if (data.success || data.verified) {
						window.location.replace('/?verified=1' + (userEmail ? '&email=' + encodeURIComponent(userEmail) : ''));
					} else {
						window.location.replace('/?verified_error=1');
					}
				})
				.catch(function () {
					// Fallback redirect to homepage
					window.location.replace('/?verified=1' + (email ? '&email=' + encodeURIComponent(email) : ''));
				});
			} catch (e) {
				window.location.replace('/');
			}
		})();
	</script>

	<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
	<link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" id="rb-preload-gfonts" href="https://fonts.googleapis.com/css?family=Jost:400,600,700,800,900%7CMulish:700,900&amp;display=swap" crossorigin>
	<link rel='stylesheet' id='foxiz-elements-css' href='../wp-content/plugins/foxiz-core/lib/foxiz-elements/public/style128b.css?ver=3.1' media='all' />
	<link rel='stylesheet' id='tools-site-chrome-css' href='../wp-content/themes/foxiz-child/assets/css/site-chrome9632.css?ver=1.2.4' media='all' />
	<link rel='stylesheet' id='foxiz-main-css' href='../wp-content/themes/foxiz/assets/css/main4250.css?ver=2.7.0' media='all' />
	<style>
		:root {
			--body-family: Jost, sans-serif;
			--h1-family: Mulish, sans-serif;
			--g-color: #488cbf;
		}
		[data-theme="dark"] {
			--solid-white: #191c20;
			--body-fcolor: #cbd5e1;
		}
		.spinner-ring {
			display: inline-block;
			width: 44px;
			height: 44px;
			border: 4px solid rgba(72, 140, 191, 0.15);
			border-radius: 50%;
			border-top-color: var(--g-color, #488cbf);
			animation: spin 0.7s linear infinite;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
	</style>
	<link rel="icon" href="../wp-content/uploads/2026/01/title.png" sizes="32x32" />
</head>
<body class="wp-singular page-template-default page" data-theme="default">
	<div class="site-outer">
		<div class="mimora-auth-page-wrap" style="min-height: 80vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
			<div style="width:100%; max-width:440px; text-align:center; padding:40px 30px; border-radius:16px; background:var(--solid-white, #fff); box-shadow:0 20px 50px rgba(15, 23, 42, 0.08);">
				<div style="margin-bottom: 20px;">
					<img src="../wp-content/uploads/2026/01/logo.png" alt="Mimora" style="height:36px; width:auto; display:inline-block;">
				</div>
				<div class="spinner-ring" style="margin-bottom: 20px;"></div>
				<h2 style="font-size:22px; font-weight:800; color:#1e293b; margin-bottom:10px;">Verifying Your Account...</h2>
				<p style="font-size:14.5px; color:#64748b; margin-bottom:15px;">Redirecting you to login in a moment.</p>
				<p style="font-size:13px; color:#94a3b8;">
					If not redirected automatically, <a href="/" id="manual-login-link" style="color:var(--g-color); font-weight:600;">click here</a>.
				</p>
			</div>
		</div>
	</div>
</body>
</html>
